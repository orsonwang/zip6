<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣郵遞區號查詢</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .highlight { background-color: #fef08a; }
        [data-theme="dark"] .highlight { background-color: #854d0e; }
    </style>
</head>
<body>
    <div class="min-h-screen bg-base-200 p-4">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold">台灣郵遞區號查詢</h1>
                <label class="swap swap-rotate">
                    <input type="checkbox" id="themeToggle" />
                    <svg class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
                    <svg class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/></svg>
                </label>
            </div>

            <!-- Search area -->
            <div class="card bg-base-100 shadow-xl mb-4">
                <div class="card-body">
                    <div class="form-control">
                        <input type="text" id="searchInput" placeholder="輸入地址查詢郵遞區號（如：基隆路一段172巷1號）" class="input input-bordered w-full" />
                    </div>

                    <!-- Parsed address info -->
                    <div id="parsedAddress" class="text-sm text-info mt-2 hidden"></div>

                    <!-- Best match result -->
                    <div id="bestMatch" class="alert alert-success mt-2 hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <div class="flex-1">
                            <div id="bestMatchZipcode" class="font-bold text-lg"></div>
                            <div id="bestMatchInfo" class="text-sm"></div>
                            <div id="englishAddress" class="text-sm mt-1 font-mono bg-success/20 px-2 py-1 rounded hidden flex items-center gap-2">
                                <span id="englishAddressText" class="flex-1"></span>
                                <button id="copyBtn" class="btn btn-ghost btn-xs" title="複製英文地址">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- No match warning -->
                    <div id="noMatchWarning" class="alert alert-warning mt-2 hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <span>找到相關路名但無法精確匹配門牌範圍，請參考以下結果</span>
                    </div>
                </div>
            </div>

            <!-- Results table -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body p-0">
                    <div class="overflow-x-auto">
                        <table class="table table-zebra">
                            <thead>
                                <tr>
                                    <th>郵遞區號</th>
                                    <th>縣市</th>
                                    <th>區域</th>
                                    <th>路名</th>
                                    <th>投遞範圍</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody">
                                <tr>
                                    <td colspan="5" class="text-center text-base-content/50">輸入地址開始搜尋</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-4 text-center text-xs text-base-content/50">
                <span id="versionInfo">{{VERSION_INFO}}</span>
            </div>
        </div>
    </div>

    <script>
        let debounceTimer;
        let currentKeyword = '';

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.checked = savedTheme === 'dark';

        themeToggle.addEventListener('change', () => {
            const theme = themeToggle.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });

        // Search input
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                search(e.target.value);
            }, 300);
        });

        // Copy button
        document.getElementById('copyBtn').addEventListener('click', async () => {
            const text = document.getElementById('englishAddressText').textContent;
            try {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('copyBtn');
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>';
                setTimeout(() => {
                    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        async function search(keyword) {
            currentKeyword = keyword;
            const parsedEl = document.getElementById('parsedAddress');
            const bestMatchEl = document.getElementById('bestMatch');
            const noMatchEl = document.getElementById('noMatchWarning');
            const resultsBody = document.getElementById('resultsBody');

            if (!keyword.trim()) {
                parsedEl.classList.add('hidden');
                bestMatchEl.classList.add('hidden');
                noMatchEl.classList.add('hidden');
                resultsBody.innerHTML = '<tr><td colspan="5" class="text-center text-base-content/50">輸入地址開始搜尋</td></tr>';
                return;
            }

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(keyword)}`);
                const data = await response.json();

                // Show parsed address
                if (data.parsedAddress) {
                    parsedEl.textContent = '解析結果：' + data.parsedAddress;
                    parsedEl.classList.remove('hidden');
                } else {
                    parsedEl.classList.add('hidden');
                }

                // Show best match
                if (data.bestMatch) {
                    document.getElementById('bestMatchZipcode').textContent = '郵遞區號：' + data.bestMatch.zipcode;
                    let info = `${data.bestMatch.city} ${data.bestMatch.district} ${data.bestMatch.street}`;
                    if (data.bestMatch.scope) info += ` (${data.bestMatch.scope})`;
                    document.getElementById('bestMatchInfo').textContent = info;
                    bestMatchEl.classList.remove('hidden');
                    noMatchEl.classList.add('hidden');

                    // Show English address
                    if (data.englishAddress) {
                        document.getElementById('englishAddressText').textContent = data.englishAddress;
                        document.getElementById('englishAddress').classList.remove('hidden');
                    } else {
                        document.getElementById('englishAddress').classList.add('hidden');
                    }
                } else {
                    bestMatchEl.classList.add('hidden');
                    if (data.results && data.results.length > 0) {
                        noMatchEl.classList.remove('hidden');
                    } else {
                        noMatchEl.classList.add('hidden');
                    }
                }

                // Show results
                if (data.results && data.results.length > 0) {
                    resultsBody.innerHTML = data.results.map(r => {
                        const rowClass = r.matched ? 'bg-success/10' : '';
                        return `<tr class="${rowClass}">
                            <td>${highlight(r.zipcode, keyword)}</td>
                            <td>${highlight(r.city, keyword)}</td>
                            <td>${highlight(r.district, keyword)}</td>
                            <td>${highlight(r.street, keyword)}</td>
                            <td>${highlight(r.scope || '', keyword)}</td>
                        </tr>`;
                    }).join('');
                } else {
                    resultsBody.innerHTML = '<tr><td colspan="5" class="text-center text-base-content/50">找不到相關結果</td></tr>';
                }
            } catch (err) {
                console.error('Search error:', err);
                resultsBody.innerHTML = '<tr><td colspan="5" class="text-center text-error">搜尋發生錯誤</td></tr>';
            }
        }

        function highlight(text, keyword) {
            if (!keyword || !text) return text;
            const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

    </script>
</body>
</html>
